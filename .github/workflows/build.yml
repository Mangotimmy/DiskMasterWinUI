name: Build and Release Multi-Arch DiskMaster Pro

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
    tags: 
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win-x64, win-arm64]

    env:
      # Optional GitHub Repository Secrets for official Authenticode signing
      # If not configured, the builder automatically falls back to generating
      # a dedicated self-signed Code Signing certificate and exports .cer
      SIGNING_CERT_BASE64: ${{ secrets.SIGNING_CERT_BASE64 }}
      SIGNING_CERT_PASSWORD: ${{ secrets.SIGNING_CERT_PASSWORD }}
      SIGNING_CERT_THUMBPRINT: ${{ secrets.SIGNING_CERT_THUMBPRINT }}

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      shell: pwsh
      run: dotnet restore DiskMasterWinUI.csproj -r ${{ matrix.target }}

    - name: Build and Sign True Single-File Portable Executable (.EXE)
      shell: pwsh
      run: |
        .\build_portable_singlefile.ps1 -Architecture ${{ matrix.target }}

    - name: Build and Sign Windows Setup Installer (.EXE)
      shell: pwsh
      run: |
        .\build_installer.ps1 -Architecture ${{ matrix.target }}

    - name: Archive WinPE Portable Zip
      shell: pwsh
      run: |
        Compress-Archive -Path publish/* -DestinationPath "DiskMaster_${{ matrix.target }}_WinPE_Portable.zip" -Force

    - name: Upload Binaries and Certificate Artifacts
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v5
      with:
        name: DiskMaster-${{ matrix.target }}-Release
        path: |
          installer_output/*
        if-no-files-found: error

    - name: Upload Portable ZIP Artifact
      if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
      uses: actions/upload-artifact@v5
      with:
        name: DiskMaster-${{ matrix.target }}-Zip
        path: DiskMaster_${{ matrix.target }}_WinPE_Portable.zip
        if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v') || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v5
      with:
        path: downloaded_artifacts

    - name: Prepare Release Directory and Resolve Name Conflicts
      run: |
        mkdir -p release_assets
        
        # Process each matrix artifact folder
        for dir in downloaded_artifacts/*; do
          if [ -d "$dir" ]; then
            arch=$(echo "$dir" | sed -E 's/.*-(win-[^/]+)-.*/\1/')
            for file in "$dir"/*; do
              if [ -f "$file" ]; then
                filename=$(basename "$file")
                # Append architecture suffix to .cer files to prevent collision
                if [[ "$filename" == *.cer ]]; then
                  ext="${filename##*.}"
                  base="${filename%.*}"
                  cp "$file" "release_assets/${base}_${arch}.${ext}"
                  # Keep default certificate name if not yet copied
                  if [ ! -f "release_assets/${filename}" ]; then
                    cp "$file" "release_assets/${filename}"
                  fi
                elif [[ "$filename" == Install-Certificate.* ]]; then
                  # Shared helper scripts
                  cp "$file" "release_assets/"
                else
                  mv "$file" "release_assets/"
                fi
              fi
            done
          fi
        done

    - name: Generate SHA256 Checksums
      run: |
        cd release_assets
        
        # 1. Generate clean SHA256SUMS.txt
        sha256sum * > SHA256SUMS.txt
        
        # 2. Generate Markdown summary for Release notes
        echo "## 🔒 SHA256 Checksums & Verification" > checksums_summary.md
        echo '```text' >> checksums_summary.md
        cat SHA256SUMS.txt >> checksums_summary.md
        echo '```' >> checksums_summary.md
        echo "" >> checksums_summary.md
        echo "### 🛡️ Code Signing Certificate Installation" >> checksums_summary.md
        echo "If Windows SmartScreen or Unknown Publisher warning appears, run \`Install-Certificate.cmd\` or \`Install-Certificate.ps1\` as administrator to trust the certificate." >> checksums_summary.md

    - name: Determine Tag Name for Release
      id: get_tag
      run: |
        if [[ "${{ github.ref }}" == refs/tags/* ]]; then
          echo "TAG_NAME=${{ github.ref_name }}" >> $GITHUB_OUTPUT
        else
          # Fallback for manual workflow_dispatch runs
          echo "TAG_NAME=v1.3.0-build-$(date +'%Y%m%d-%H%M%S')" >> $GITHUB_OUTPUT
        fi

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        tag_name: ${{ steps.get_tag.outputs.TAG_NAME }}
        files: |
          release_assets/*
        body_path: release_assets/checksums_summary.md
        generate_release_notes: true
        draft: false
        prerelease: ${{ contains(steps.get_tag.outputs.TAG_NAME, 'build') || contains(steps.get_tag.outputs.TAG_NAME, 'beta') || contains(steps.get_tag.outputs.TAG_NAME, 'rc') }}