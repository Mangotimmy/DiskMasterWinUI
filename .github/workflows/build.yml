name: Build and Release Multi-Arch DiskMaster Pro

on:
  push:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
    tags: 
      - 'v*'
  pull_request:
    branches: [ "main", "master" ]
    paths-ignore:
      - '**.md'
      - 'docs/**'
      - '.gitignore'
      - 'LICENSE'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    name: Build ${{ matrix.target }}
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        target: [win-x64, win-arm64]

    steps:
    - name: Checkout repository
      uses: actions/checkout@v5

    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v5
      with:
        dotnet-version: '9.0.x'

    - name: Restore dependencies
      shell: pwsh
      run: dotnet restore DiskMasterWinUI.csproj -r ${{ matrix.target }}

    - name: Build One-File Portable Executable (.EXE)
      shell: pwsh
      run: |
        .\build_portable_singlefile.ps1 -Architecture ${{ matrix.target }}

    - name: Archive WinPE Portable Zip
      shell: pwsh
      run: |
        Compress-Archive -Path publish/* -DestinationPath DiskMaster_${{ matrix.target }}_WinPE_Portable.zip

    - name: Upload Single-File EXE Artifact
      uses: actions/upload-artifact@v5
      with:
        name: DiskMaster-${{ matrix.target }}-Portable
        path: installer_output/*.exe
        if-no-files-found: error

    - name: Upload Portable ZIP Artifact
      uses: actions/upload-artifact@v5
      with:
        name: DiskMaster-${{ matrix.target }}-Zip
        path: DiskMaster_${{ matrix.target }}_WinPE_Portable.zip
        if-no-files-found: error

  release:
    name: Create GitHub Release
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    
    permissions:
      contents: write

    steps:
    - name: Download all artifacts
      uses: actions/download-artifact@v5

    # 🔑 新增：自動計算所有檔案的 SHA256 並生成 SHA256SUMS.txt
    - name: Generate SHA256 Checksums
      run: |
        echo "## SHA256 Checksums" > checksums_summary.md
        echo '```' >> checksums_summary.md
        
        # 尋找所有下載下來的 .exe 與 .zip 檔案並計算 SHA256
        find . -type f \( -name "*.exe" -o -name "*.zip" \) -exec sha256sum {} + | sed 's|./[^/]*/||' > SHA256SUMS.txt
        
        cat SHA256SUMS.txt >> checksums_summary.md
        echo '```' >> checksums_summary.md
        
        echo "Generated Checksums:"
        cat SHA256SUMS.txt

    - name: Publish GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        files: |
          DiskMaster-win-x64-Portable/*.exe
          DiskMaster-win-arm64-Portable/*.exe
          DiskMaster-win-x64-Zip/DiskMaster_win-x64_WinPE_Portable.zip
          DiskMaster-win-arm64-Zip/DiskMaster_win-arm64_WinPE_Portable.zip
          SHA256SUMS.txt
        body_path: checksums_summary.md
        generate_release_notes: true
